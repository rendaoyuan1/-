name: Update MusicFree Plugins

on:
  schedule:
    # 每天北京时间 06:20 自动同步（UTC 22:20）
    - cron: '20 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-musicfree-plugins
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate subscription
        run: python scripts/update_musicfree_plugins.py

      - name: Commit changes
        run: |
          if git diff --quiet -- musicfree-unified-plugins.json; then
            echo "No plugin changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add musicfree-unified-plugins.json
          git commit -m "Auto update MusicFree plugins"
          git push
